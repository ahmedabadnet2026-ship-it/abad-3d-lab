<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معمل الشبكات — معهد شبكة آباد للتدريب | جولة ثلاثية الأبعاد</title>
<meta name="description" content="مجسّم ثلاثي الأبعاد تفاعلي لمعمل الشبكات في معهد شبكة آباد للتدريب بالرياض">
<link rel="icon" href="abad-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"CairoLocal";src:url("Cairo.ttf") format("truetype");font-weight:200 1000;font-display:swap}
:root{--navy:#0A5F91;--navy-d:#074B73;--gold:#F5BD2D;--gold-d:#C9930A;--glass:rgba(8,20,34,.78);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0d10;font-family:"Cairo","CairoLocal",system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font-family:inherit;cursor:pointer}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(6,14,24,.92),rgba(6,14,24,.72));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .chip{background:#fff;border-radius:10px;padding:4px 9px;box-shadow:inset 0 -3px 0 var(--gold)}
.brand img{height:30px;display:block}
.brand h1{font-size:15px;font-weight:800;line-height:1.25}
.brand h1 small{display:block;font-size:12px;font-weight:600;color:#a9bccd}
.racks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline-start:auto;padding:2px}
.racks::-webkit-scrollbar{display:none}
.racks button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#dce8f2;font-weight:700;font-size:13px;
  padding:6px 13px;border-radius:10px;transition:.2s;direction:ltr}
.racks button:hover{background:rgba(255,255,255,.14)}
.racks button.on{background:var(--gold);color:#2a1d00;border-color:var(--gold);box-shadow:0 4px 14px rgba(245,189,45,.4)}
.racks button.srv{border-color:rgba(80,120,255,.6)}
.racks button.srv.on{background:#4a6bff;color:#fff;border-color:#4a6bff}

/* info card */
.card{position:fixed;z-index:10;right:16px;bottom:84px;width:340px;max-width:calc(100vw - 32px);background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  transform:translateY(16px);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1)}
.card.show{transform:none;opacity:1;pointer-events:auto}
.card .x{position:absolute;top:10px;left:12px;background:none;border:0;color:#9fb3c6;font-size:20px;line-height:1}
.card .kicker{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.card h2{font-size:20px;font-weight:900;margin:2px 0 6px;line-height:1.35}
.card p{font-size:14px;color:#c3d3e1;line-height:1.7}
.card ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.card li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:700}
.card li .tg{font-size:12px;font-weight:800;background:var(--gold);color:#2a1d00;border-radius:6px;padding:1px 7px;direction:ltr;min-width:38px;text-align:center}
.card li .tg.b{background:#4a6bff;color:#fff}
.card li small{margin-inline-start:auto;color:#8fa6ba;font-weight:600;font-size:12px}
.card .note{margin-top:10px;font-size:12px;color:#ffd76e;background:rgba(245,189,45,.1);border:1px dashed rgba(245,189,45,.45);border-radius:8px;padding:5px 9px}

/* dock */
.dock{position:fixed;z-index:10;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:16px;padding:6px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.dock button{flex:none;border:0;background:transparent;color:#dce8f2;font-weight:700;font-size:14px;padding:8px 14px;border-radius:11px;white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.1)}
.dock button.on{background:rgba(245,189,45,.18);color:var(--gold)}
.dock button.tour{background:var(--gold);color:#2a1d00}
.dock button.tour.on{background:#ff6b5b;color:#fff}
.hint{position:fixed;z-index:9;left:16px;bottom:84px;font-size:12.5px;color:#c4d3e0;background:var(--glass);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);line-height:1.6;max-width:260px}
.hint b{color:var(--gold)}

/* hotspot markers */
.mk{position:fixed;z-index:8;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;border:0;background:none;color:#fff;
  font-weight:800;font-size:12.5px;pointer-events:auto;white-space:nowrap}
.mk i{width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(245,189,45,.7);animation:pulse 1.8s infinite;display:grid;place-items:center;font-style:normal;color:#2a1d00;font-size:14px}
.mk span{background:rgba(6,14,24,.8);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.mk.hide{display:none}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(245,189,45,0)}100%{box-shadow:0 0 0 0 rgba(245,189,45,0)}}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0b0d10;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.loading div{font-weight:700;color:#a9bccd}

@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .brand img{height:24px}
  .brand h1{font-size:13px}
  .brand h1 small{display:none}
  .racks{margin:0;width:100%}
  .racks button{padding:5px 11px;font-size:12.5px}
  .card{right:10px;left:10px;width:auto;bottom:74px;padding:14px}
  .card h2{font-size:17px}
  .card p{font-size:13px}
  .card li{padding:5px 9px;font-size:13px}
  .hint{display:none}
  .dock{bottom:10px}
  .dock button{font-size:13px;padding:7px 10px}
  .mk span{display:none}
}
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<body>
<canvas id="c" aria-label="مجسّم ثلاثي الأبعاد لمعمل الشبكات"></canvas>

<header class="top">
  <div class="brand">
    <span class="chip"><img src="abad-logo.png" alt="معهد شبكة آباد للتدريب"></span>
    <h1>معمل الشبكات — معهد شبكة آباد للتدريب<small>جولة ثلاثية الأبعاد في المعمل</small></h1>
  </div>
  <nav class="racks" id="racks" aria-label="اختيار الخزانة"></nav>
</header>

<aside class="card" id="card" aria-live="polite">
  <button class="x" id="cardX" aria-label="إغلاق">×</button>
  <div class="kicker" id="cKick"></div>
  <h2 id="cTitle"></h2>
  <p id="cDesc"></p>
  <ul id="cList"></ul>
  <div class="note" id="cNote" hidden></div>
</aside>

<div class="hint"><b>اسحب</b> للتدوير · <b>العجلة / إصبعين</b> للتقريب · <b>انقر</b> على أي خزانة أو نقطة مضيئة</div>

<div class="dock" id="dock">
  <button data-go="overview">نظرة عامة</button>
  <button data-go="tools">طاولة الأدوات</button>
  <button data-go="wsLeft">محطات العمل</button>
  <button data-go="wsRight">الصف الأيمن</button>
  <button class="tour" id="tourBtn">▶ جولة</button>
</div>

<div id="markers"></div>
<div class="loading" id="loading"><div>جارٍ تجهيز المعمل…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const params = new URLSearchParams(location.search);
const isMobile = matchMedia('(max-width:760px)').matches;

// ---------------- renderer / scene ----------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 60);

// Room: x = width (left wall -3.5 … right wall 3.5), z = length (back wall -5.5 … front 5.5)
const W = 7, L = 11, H = 2.9, X0 = -W / 2, X1 = W / 2, Z0 = -L / 2, Z1 = L / 2;

// ---------------- canvas textures ----------------
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
// light oak planks (texture = 2m x 2m, planks run along z)
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(7), cols = 10, pw = w / cols;
  for (let i = 0; i < cols; i++) {
    let y = -r() * 300;
    while (y < h) {
      const len = 380 + r() * 420, l = 74 + r() * 10, s = 30 + r() * 12;
      g.fillStyle = `hsl(${34 + r() * 5},${s}%,${l}%)`; g.fillRect(i * pw, y, pw, len);
      for (let k = 0; k < 22; k++) {
        g.strokeStyle = `rgba(${120 + r() * 40},${85 + r() * 30},${50},${0.05 + r() * 0.1})`; g.lineWidth = 1 + r() * 2;
        const x = i * pw + r() * pw; g.beginPath(); g.moveTo(x, y);
        g.bezierCurveTo(x + (r() - .5) * 14, y + len * .33, x + (r() - .5) * 14, y + len * .66, x + (r() - .5) * 8, y + len); g.stroke();
      }
      g.fillStyle = 'rgba(90,65,40,.45)'; g.fillRect(i * pw, y, pw, 2);
      y += len;
    }
    g.fillStyle = 'rgba(90,65,40,.4)'; g.fillRect(i * pw, 0, 2, h);
  }
}, [W / 2, L / 2]);
// light wood wall panel (texture = one 1.2m x 2.9m panel, seam on the left edge)
const wallTexFor = (len) => canvasTex(512, 1024, (g, w, h) => {
  const r = rng(11);
  const grd = g.createLinearGradient(0, 0, w, 0); grd.addColorStop(0, '#cda676'); grd.addColorStop(.5, '#d6b183'); grd.addColorStop(1, '#c99f6e');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 140; k++) {
    g.strokeStyle = `rgba(${130 + r() * 50},${90 + r() * 30},50,${0.04 + r() * 0.08})`; g.lineWidth = 1 + r() * 3;
    const x = r() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + (r() - .5) * 20, h * .3, x + (r() - .5) * 20, h * .7, x + (r() - .5) * 10, h); g.stroke();
  }
  g.fillStyle = '#5e5348'; g.fillRect(0, 0, 7, h);
  g.fillStyle = 'rgba(230,230,230,.55)'; g.fillRect(7, 0, 2, h);
}, [len / 1.2, 1]);
// black slatted ceiling (lines along z)
const ceilTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#060606'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#2a2826' : '#24221f'; g.fillRect(i * 16 + 3, 0, 11, h); g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(i * 16 + 3, 0, 1, h); }
}, [W / 0.64, L / 2]);
// workstation screen: blue slide with ABAD logo
const logoImg = new Image(); logoImg.src = 'abad-logo.png';
const screenCanvas = document.createElement('canvas'); screenCanvas.width = 512; screenCanvas.height = 300;
function drawScreen() {
  const g = screenCanvas.getContext('2d'), w = 512, h = 300;
  const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#0b1f7a'); grd.addColorStop(.55, '#1d3fc4'); grd.addColorStop(1, '#3a1d8c');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(120,170,255,${.06 + i * .02})`; g.beginPath(); g.arc(120 + i * 18, 190 - i * 8, 120 - i * 16, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(300, 26, 186, 86, 10); g.fill();
  if (logoImg.complete && logoImg.naturalWidth) g.drawImage(logoImg, 308, 32, 170, 76);
  g.fillStyle = '#fff'; g.font = '700 22px Cairo, CairoLocal, sans-serif'; g.textAlign = 'right'; g.direction = 'rtl';
  g.fillText('معمل الشبكات', 486, 150);
  g.font = '600 15px Cairo, CairoLocal, sans-serif'; g.fillStyle = '#cfe0ff'; g.fillText('تعلّم بالتجربة', 486, 176);
  g.fillStyle = '#fff'; g.fillRect(420, 196, 66, 66);
  const r = rng(3); g.fillStyle = '#111';
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) if (r() > .5) g.fillRect(423 + x * 5.5, 199 + y * 5.5, 5, 5);
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(0, h - 16, w, 16); // taskbar
  ['#2b7bff', '#f5bd2d', '#3ee08f', '#ff5b5b'].forEach((c, i) => { g.fillStyle = c; g.fillRect(200 + i * 22, h - 13, 12, 10); });
}
drawScreen();
const screenTex = new THREE.CanvasTexture(screenCanvas); screenTex.colorSpace = THREE.SRGBColorSpace;
logoImg.onload = () => { drawScreen(); screenTex.needsUpdate = true; };
document.fonts && document.fonts.ready.then(() => { drawScreen(); screenTex.needsUpdate = true; });

// Cisco-style device front panels
function ciscoText(g, x, y, size) {
  g.fillStyle = '#ffffff'; g.font = `700 ${size}px Arial, Helvetica, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('CISCO', x, y);
}
function yellowTag(g, x, y, text, size) {
  g.font = `800 ${size}px Arial, sans-serif`; const tw = g.measureText(text).width + size * .8;
  g.fillStyle = '#f7d23a'; g.fillRect(x, y - size * .7, tw, size * 1.4);
  g.fillStyle = '#111'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(text, x + size * .4, y + 1);
}
function routerTex(label) {
  return canvasTex(640, 128, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#8aa0ae'); grd.addColorStop(1, '#5f7583'); g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = '#3d4d58'; g.fillRect(0, 0, 18, h); g.fillRect(w - 18, 0, 18, h);           // rack ears
    g.fillStyle = '#1e2a33'; [[5, 18], [5, 100], [w - 13, 18], [w - 13, 100]].forEach(([x, y]) => { g.beginPath(); g.arc(x + 4, y, 4, 0, 7); g.fill(); });
    g.fillStyle = '#2f9fc4'; for (let i = 0; i < 7; i++) { const hh = [10, 18, 26, 34, 26, 18, 10][i] * .55; g.fillRect(34 + i * 7, 30 - hh / 2, 3, hh); }
    ciscoText(g, 30, 58, 22);
    yellowTag(g, 30, 96, label, 20);
    // module slots
    g.fillStyle = '#4b5d69'; g.fillRect(140, 18, 150, 44); g.fillRect(140, 70, 150, 44);
    g.strokeStyle = '#30404b'; g.lineWidth = 2; g.strokeRect(140, 18, 150, 44); g.strokeRect(140, 70, 150, 44);
    // gigabit ports + LEDs
    for (let i = 0; i < 3; i++) {
      g.fillStyle = '#d7dde2'; g.fillRect(320 + i * 54, 52, 42, 36);
      g.fillStyle = '#111'; g.fillRect(325 + i * 54, 58, 32, 26);
      g.fillStyle = '#39e36b'; g.fillRect(324 + i * 54, 42, 8, 5);
      g.fillStyle = '#ffb02e'; g.fillRect(346 + i * 54, 42, 8, 5);
    }
    g.fillStyle = '#5ac8fa'; g.fillRect(500, 56, 34, 28);   // console
    g.fillStyle = '#222'; g.fillRect(546, 56, 26, 28);      // usb/aux
    g.fillStyle = '#39e36b'; g.beginPath(); g.arc(598, 40, 6, 0, 7); g.fill();
    g.fillStyle = '#e8eef2'; g.font = '700 11px Arial'; g.fillText('SYS', 588, 58); g.fillText('CON', 504, 98);
  });
}
function switchTex(label) {
  return canvasTex(1024, 104, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#7f95a3'); grd.addColorStop(1, '#5a6f7d'); g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = '#3d4d58'; g.fillRect(0, 0, 24, h); g.fillRect(w - 24, 0, 24, h);
    g.fillStyle = '#2f9fc4'; for (let i = 0; i < 7; i++) { const hh = [10, 18, 26, 34, 26, 18, 10][i] * .5; g.fillRect(40 + i * 7, 26 - hh / 2, 3, hh); }
    ciscoText(g, 36, 52, 20);
    yellowTag(g, 36, 82, label, 16);
    for (let i = 0; i < 24; i++) g.fillStyle = (i % 3 ? '#39e36b' : '#ffb02e'), g.fillRect(150 + i * 12, 20, 7, 6);
    for (let b = 0; b < 4; b++) for (let i = 0; i < 6; i++) for (let row = 0; row < 2; row++) {
      const x = 460 + b * 112 + i * 17, y = 18 + row * 38;
      g.fillStyle = '#c9d1d7'; g.fillRect(x, y, 15, 32); g.fillStyle = '#0d0d0d'; g.fillRect(x + 2, y + 3, 11, 25);
    }
    for (let i = 0; i < 2; i++) { g.fillStyle = '#2b3740'; g.fillRect(920 + i * 40, 24, 32, 52); g.fillStyle = '#111'; g.fillRect(924 + i * 40, 30, 24, 40); }
    g.fillStyle = '#e8eef2'; g.font = '700 11px Arial'; g.fillText('SYST', 150, 46); g.fillText('STAT', 190, 46);
  });
}
const texR1 = routerTex('R1'), texR2 = routerTex('R2'), texSW = switchTex('SW1');

// ---------------- materials ----------------
const M = {
  wall: (len) => new THREE.MeshStandardMaterial({ map: wallTexFor(len), roughness: 0.75 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0 }),
  ceil: new THREE.MeshStandardMaterial({ map: ceilTex, roughness: 0.9 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2f2ef, roughness: 0.45 }),
  whiteM: new THREE.MeshStandardMaterial({ color: 0xe9ecee, roughness: 0.3, metalness: 0.2 }),
  black: new THREE.MeshStandardMaterial({ color: 0x141516, roughness: 0.6, metalness: 0.2 }),
  blackMesh: new THREE.MeshStandardMaterial({ color: 0x1a1b1d, roughness: 0.85, transparent: true, opacity: 0.88 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x2b2e31, roughness: 0.9 }),
  red: new THREE.MeshStandardMaterial({ color: 0x9d1d22, roughness: 0.8 }),
  gray: new THREE.MeshStandardMaterial({ color: 0x8c9196, roughness: 0.4, metalness: 0.5 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xc8ccd0, roughness: 0.25, metalness: 0.9 }),
  duct: new THREE.MeshStandardMaterial({ color: 0xd0d4d8, roughness: 0.25, metalness: 0.85 }),
  devSide: new THREE.MeshStandardMaterial({ color: 0x55636d, roughness: 0.4, metalness: 0.6 }),
  screen: new THREE.MeshBasicMaterial({ map: screenTex }),
  bezel: new THREE.MeshStandardMaterial({ color: 0x0d0e10, roughness: 0.35, metalness: 0.3 }),
  led: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  blueLed: new THREE.MeshBasicMaterial({ color: 0x2a3dff }),
  glass: new THREE.MeshStandardMaterial({ color: 0x223040, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.35 }),
  darkGlass: new THREE.MeshStandardMaterial({ color: 0x3a4652, roughness: 0.15, metalness: 0.6 }),
};

// ---------------- helpers ----------------
const shadow = (o, cast = true, recv = true) => { o.traverse(m => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } }); return o; };
function box(w, h, d, mat, x, y, z, parent = scene) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; }

function mg(list) {

  tools: { kicker: 'منطقة التطبيق', title: 'طاولة الأدوات', desc: 'طاولات بيضاء متلاصقة في وسط المعمل عليها أدوات تجهيز الكابلات وفحصها.',
    list: [['🔧', 'Crimping Tool', 'كرّامة RJ45'], ['✂', 'Stripper', 'قشّارة كابلات'], ['⚡', 'Cable Tester', 'جهاز فحص الكابلات'], ['▣', 'Tool Pouches', 'حقائب أدوات']], note: null },
  wsLeft: { kicker: 'محطات المتدربين', title: 'محطات العمل', desc: `مكتب أبيض متصل على امتداد الجدار الأيسر والخلفي، عليه أجهزة All-in-One، وفوقه خزائن الشبكة Rack 1–7.`,
    list: [['PC', 'All-in-One', `${ws.length} جهاز في المعمل`]], note: null },
  wsRight: { kicker: 'محطات المتدربين', title: 'الصف الأيمن', desc: 'صف محطات على الجدار الأيمن خلف خزانة الخوادم، بكراسٍ بيضاء ومقاعد حمراء.',
    list: [['PC', 'All-in-One', 'أجهزة المتدربين']], note: null },
  overview: null,
};

// ---------------- views ----------------
const V = {
  overview: { p: [2.15, 1.6, 5.3], t: [-0.9, 1.15, -4.0] },
  tools: { p: [1.7, 1.85, 2.6], t: [-0.1, 0.7, 0.2] },
  wsLeft: { p: [0.6, 1.55, 3.4], t: [-3.2, 1.05, -0.8] },
  wsRight: { p: [-1.2, 1.6, 2.2], t: [3.2, 0.95, -1.6] },
  server: { p: [0.9, 1.45, 1.95], t: [3.0, 1.05, 2.95] },
};
function rackView(i) {
  const g = cabinetObjs[i], c = g.position;
  const sh = isMobile ? 0 : 0.42, dy = isMobile ? -0.45 : -0.12, d = isMobile ? 2.5 : 2.45;
  if (RACKS[i].wall === 'L') return { p: [X0 + d, 1.72, c.z + 0.55 - sh], t: [c.x, c.y + dy, c.z - sh] };
  return { p: [c.x + 0.55 + sh, 1.72, Z0 + d], t: [c.x + sh, c.y + dy, c.z] };
}

// ---------------- controls + camera fly ----------------
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.8; controls.minDistance = 0.6; controls.maxDistance = 11;
camera.position.set(...V.overview.p); controls.target.set(...V.overview.t); controls.update();
let fly = null;
function flyTo(v, dur = 1600) {
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new THREE.Vector3(...v.p), t1: new THREE.Vector3(...v.t), s: performance.now(), d: dur };
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------------- UI ----------------
const rackBar = document.getElementById('racks');
const tabs = [];
RACKS.forEach((_, i) => { const b = document.createElement('button'); b.textContent = `Rack ${i + 1}`; b.onclick = () => { stopTour(); selectRack(i); }; rackBar.appendChild(b); tabs.push(b); });
const srvTab = document.createElement('button'); srvTab.className = 'srv'; srvTab.textContent = 'Server Rack'; srvTab.onclick = () => { stopTour(); selectSpot('server'); }; rackBar.appendChild(srvTab);
const card = document.getElementById('card');
document.getElementById('cardX').onclick = () => card.classList.remove('show');
function showCard(c) {
  if (!c) { card.classList.remove('show'); return; }
  document.getElementById('cKick').textContent = c.kicker; document.getElementById('cTitle').textContent = c.title; document.getElementById('cDesc').textContent = c.desc;
  document.getElementById('cList').innerHTML = c.list.map(([t, en, ar]) => `<li><span class="tg ${c.blue ? 'b' : ''}">${t}</span><span class="en">${en}</span><small>${ar}</small></li>`).join('');
  const n = document.getElementById('cNote'); n.hidden = !c.note; n.textContent = c.note || '';
  card.classList.add('show');
}
function clearHighlight() {
  cabinetObjs.forEach(g => { g.userData.edges.material.opacity = 0; g.userData.frameMat.emissiveIntensity = 0; g.userData.lab.material.map = g.userData.labTexOff; });
  srvEdges.material.opacity = 0;
  tabs.forEach(b => b.classList.remove('on')); srvTab.classList.remove('on');
  document.querySelectorAll('.dock button[data-go]').forEach(b => b.classList.remove('on'));
}
let selected = null;
function selectRack(i, fly_ = true) {
  clearHighlight(); selected = { type: 'rack', i };
  const g = cabinetObjs[i]; g.userData.edges.material.opacity = 1; g.userData.frameMat.emissiveIntensity = 0; g.userData.lab.material.map = g.userData.labTexOn;
  tabs[i].classList.add('on'); tabs[i].scrollIntoView({ inline: 'nearest', block: 'nearest' });
  showCard(rackCard(i)); if (fly_) flyTo(rackView(i));
}
function selectSpot(id) {
  clearHighlight(); selected = { type: 'spot', id };
  if (id === 'server') { srvEdges.material.opacity = 1; srvTab.classList.add('on'); }
  document.querySelector(`.dock button[data-go="${id}"]`)?.classList.add('on');
  showCard(CARDS[id]); flyTo(V[id]);
}
document.querySelectorAll('.dock button[data-go]').forEach(b => b.onclick = () => { stopTour(); selectSpot(b.dataset.go); });

// hotspot markers (projected HTML)
const markers = [
  { id: 'tools', label: 'طاولة الأدوات', pos: new THREE.Vector3(0.0, 1.0, 0.4) },
  { id: 'server', label: 'خزانة الخوادم', pos: new THREE.Vector3(X1 - 0.5, 2.25, 2.95) },
  { id: 'wsLeft', label: 'محطات العمل', pos: new THREE.Vector3(X0 + 0.3, 1.35, 0.6) },
  { id: 'wsRight', label: 'الصف الأيمن', pos: new THREE.Vector3(X1 - 0.3, 1.35, -2.0) },
];
const mkWrap = document.getElementById('markers');
markers.forEach(m => { const b = document.createElement('button'); b.className = 'mk'; b.innerHTML = `<i>+</i><span>${m.label}</span>`; b.onclick = () => { stopTour(); selectSpot(m.id); }; mkWrap.appendChild(b); m.el = b; });
const tmpV = new THREE.Vector3();
function updateMarkers() {
  markers.forEach(m => {
    tmpV.copy(m.pos).project(camera);
    const behind = tmpV.z > 1 || camera.position.distanceTo(m.pos) < 1.2;
    m.el.classList.toggle('hide', behind || Math.abs(tmpV.x) > 1.05 || Math.abs(tmpV.y) > 1.05);
    m.el.style.transform = `translate(${(tmpV.x * .5 + .5) * innerWidth}px,${(-tmpV.y * .5 + .5) * innerHeight}px) translate(-50%,-50%)`;
  });
}

// picking: click (not drag) on a cabinet / server rack / tool table
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [...cabinetObjs, srv, tableGroup];
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; stopTour(); fly = null; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, true).find(h => h.object.isMesh && h.object.userData.pick);
  if (!hit) return; const p = hit.object.userData.pick;
  if (p.type === 'rack') selectRack(p.i); else if (p.type === 'server') selectSpot('server'); else selectSpot(p.id);
});
canvas.addEventListener('pointermove', e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  canvas.style.cursor = ray.intersectObjects(pickables, true).some(h => h.object.isMesh) ? 'pointer' : 'grab';
});

// guided tour
const tourBtn = document.getElementById('tourBtn');
const TOUR = [() => selectSpot('overview'), ...RACKS.map((_, i) => () => selectRack(i)), () => selectSpot('tools'), () => selectSpot('server'), () => selectSpot('wsLeft'), () => selectSpot('wsRight'), () => selectSpot('overview')];
let tourTimer = null, tourIdx = 0;
function stepTour() { TOUR[tourIdx](); tourIdx++; if (tourIdx >= TOUR.length) { stopTour(); return; } tourTimer = setTimeout(stepTour, 4200); }
function stopTour() { clearTimeout(tourTimer); tourTimer = null; tourBtn.classList.remove('on'); tourBtn.textContent = '▶ جولة'; }
tourBtn.onclick = () => { if (tourTimer) return stopTour(); tourIdx = 0; tourBtn.classList.add('on'); tourBtn.textContent = '■ إيقاف'; stepTour(); };

// ---------------- resize / loop ----------------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 80 : 74;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.s) / fly.d), e = ease(k);
    camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  camera.position.set(clamp(camera.position.x, X0 + 0.2, X1 - 0.2), clamp(camera.position.y, 0.35, H - 0.15), clamp(camera.position.z, Z0 + 0.2, Z1 - 0.15));
  if (selected?.type === 'rack') cabinetObjs[selected.i].userData.edges.material.opacity = 0.6 + Math.sin(t * 4) * 0.4;
  blueStrip.material.color.setHSL(0.64, 1, 0.5 + Math.sin(t * 2) * 0.08);
  renderer.render(scene, camera);
  updateMarkers();
}
loop();

// initial state: photo-like overview, Rack 1 selected; then fly to Rack 1
document.getElementById('loading').classList.add('done');
const startRack = params.has('rack') ? clamp(parseInt(params.get('rack')) - 1, 0, 6) : 0;
if (params.get('view') === 'overview') { selectRack(startRack, false); card.classList.remove('show'); }
else if (params.get('spot') && V[params.get('spot')]) { const s = params.get('spot'); clearHighlight(); fly = null; selectSpot(s); fly && (fly.d = 1); }
else if (params.has('rack')) { selectRack(startRack, true); fly.d = 1; }
else { selectRack(startRack, false); setTimeout(() => { if (!tourTimer && !fly) flyTo(rackView(startRack), 2000); }, 1800); }
window.__ready = true;
</script>
</body>
</html>
